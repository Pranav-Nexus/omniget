[package]
name = "omniget-ui"
version = "1.0.0"
description = "OmniGet UI Native Windows Storefront"
authors = ["Nexus"]
edition = "2021"

[build-dependencies]
tauri-build = "=2.0.0"

[dependencies]
tauri = "=2.0.0"
serde = "=1.0.200"
serde_json = "=1.0.120"
regex = "=1.10.5"
tokio = { version = "=1.38.0", features = ["full"] }
window-vibrancy = "=0.5.0"
dirs = "=5.0.1"
indexmap = "=2.7.0"
idna_adapter = "=1.2.0"
idna = "=1.0.0"
unicode-segmentation = "=1.12.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
